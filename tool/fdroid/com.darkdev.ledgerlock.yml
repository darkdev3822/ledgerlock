# DRAFT for fdroiddata (metadata/com.darkdev.ledgerlock.yml). Submitted by the owner via a GitLab merge request.
# Mirrors what was verified locally on 2026-11-06 (arm64-v8a full APK; OpenSSL/SQLCipher for all three ABIs).
# Before submitting: tag v1.0.0 on GitHub and replace `commit:` values with the tag's commit hash if reviewers ask.
Categories:
  - Money
License: GPL-3.0-only
AuthorName: Dark Dev
SourceCode: https://github.com/darkdev3822/ledgerlock
IssueTracker: https://github.com/darkdev3822/ledgerlock/issues

AutoName: LedgerLock

RepoType: git
Repo: https://github.com/darkdev3822/ledgerlock.git

Builds:
  - versionName: 1.0.0
    versionCode: 1001
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.9
    rm:
      - ios
    prebuild:
      # biometric_storage needs a JDK 17 toolchain: use the build server's JDK, never download one.
      - sed -i '/foojay/d' android/settings.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    ndk: r28c
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_ROOT=$$NDK$$
      # SQLCipher 4.19.0 + OpenSSL 4.0.3 from sha256-pinned sources (no prebuilt libsqlcipher download)
      - tool/fdroid/build_sqlcipher.sh armeabi-v7a
      # Tesseract4Android 4.9.0 from source at a pinned commit (no JitPack AAR)
      - tool/fdroid/fetch_tesseract.sh
      - export ORG_GRADLE_PROJECT_ledgerlockTesseractSrc=$(pwd)/build/fdroid-native/Tesseract4Android
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.0
    versionCode: 2001
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.47.9
    rm:
      - ios
    prebuild:
      - sed -i '/foojay/d' android/settings.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    ndk: r28c
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_ROOT=$$NDK$$
      - tool/fdroid/build_sqlcipher.sh arm64-v8a
      - tool/fdroid/fetch_tesseract.sh
      - export ORG_GRADLE_PROJECT_ledgerlockTesseractSrc=$(pwd)/build/fdroid-native/Tesseract4Android
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64

  - versionName: 1.0.0
    versionCode: 4001
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@3.47.9
    rm:
      - ios
    prebuild:
      - sed -i '/foojay/d' android/settings.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    ndk: r28c
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_ROOT=$$NDK$$
      - tool/fdroid/build_sqlcipher.sh x86_64
      - tool/fdroid/fetch_tesseract.sh
      - export ORG_GRADLE_PROJECT_ledgerlockTesseractSrc=$(pwd)/build/fdroid-native/Tesseract4Android
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-x64

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 1000 + %c
  - 2000 + %c
  - 4000 + %c
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
